name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for low-risk Dependabot PRs. Auto-merge
# only fires once every *required* status check on master (test, e2e) passes,
# so this never merges a red PR. Major bumps are deliberately left alone: on
# this repo they routinely need a manual retarget decision.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch + minor only. Majors (and anything Dependabot cannot classify)
      # fall through and stay open for a human.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
